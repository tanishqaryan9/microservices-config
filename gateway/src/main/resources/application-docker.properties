server.port=8084
spring.application.name=gateway

# Eureka
eureka.client.service-url.defaultZone=http://service-reg:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Company service
spring.cloud.gateway.server.webmvc.routes[0].id=company_service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://company:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/company/**

# Job service
spring.cloud.gateway.server.webmvc.routes[1].id=job_service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://job:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/jobs/**

# Review service
spring.cloud.gateway.server.webmvc.routes[2].id=review_service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://reviews:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/reviews/**

# Eureka dashboard
spring.cloud.gateway.server.webmvc.routes[3].id=eureka_server
spring.cloud.gateway.server.webmvc.routes[3].uri=http://service-reg:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/

spring.cloud.gateway.server.webmvc.routes[4].id=eureka_server_static
spring.cloud.gateway.server.webmvc.routes[4].uri=http://service-reg:8761
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/eureka/**

# Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG