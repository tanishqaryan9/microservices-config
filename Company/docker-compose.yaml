services:
  postgres:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aryan@95
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped


  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9411/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservice-network
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - postgres

  service-reg:
    container_name: service-reg
    image: tanishqaryan9/service-reg:latest
    ports:
      - "8761:8761"
    networks:
      - microservice-network
      - postgres

  config-server:
      container_name: config-server
      image: tanishqaryan9/config-server:latest
      ports:
        - "8080:8080"
      depends_on:
        - service-reg
      networks:
        - microservice-network
        - postgres
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-reg:8761/eureka

  company:
      container_name: company
      image: tanishqaryan9/company:latest
      ports:
        - "8081:8081"
      depends_on:
        - config-server
        - rabbitmq
      networks:
        - microservice-network
        - postgres
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_RABBITMQ_HOST=rabbitmq
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-reg:8761/eureka

  job:
      container_name: job
      image: tanishqaryan9/job:latest
      ports:
        - "8082:8082"
      depends_on:
        - config-server
        - rabbitmq
      networks:
        - microservice-network
        - postgres
      restart: on-failure
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8080
        - SPRING_CLOUD_CONFIG_URI=http://config-server:8080
        - SPRING_RABBITMQ_HOST=rabbitmq
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-reg:8761/eureka

  reviews:
      container_name: reviews
      image: tanishqaryan9/reviews:latest
      ports:
        - "8083:8083"
      depends_on:
        - config-server
        - rabbitmq
      networks:
        - microservice-network
        - postgres
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_RABBITMQ_HOST=rabbitmq
        - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-reg:8761/eureka
  gateway:
    container_name: gateway
    image: tanishqaryan9/gateway
    ports:
      - 8084:8084
    depends_on:
      - service-reg
    networks:
      - microservice-network
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=docker
networks:
  microservice-network:
    driver: bridge
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin: